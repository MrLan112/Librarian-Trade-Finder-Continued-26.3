name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build mod
        run: ./gradlew build
      - name: Upload built jars
        uses: actions/upload-artifact@v6
        with:
          name: librarian-trade-finder-continued-26.3
          path: build/libs/*.jar
